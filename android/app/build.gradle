plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.brooth.blaze'
    compileSdk 36
    defaultConfig {
        applicationId 'com.brooth.blaze'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.5.0-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging true } }
}
chaquopy {
    defaultConfig {
        version '3.12'
        pip { install 'yt-dlp==2026.8.19'; install 'yt-dlp-ejs==0.8.0' }
    }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    // CI keeps the upstream Java bindings and replaces GPL native binaries with our LGPL-only build.
    implementation files('libs/libvlc-java.aar')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
