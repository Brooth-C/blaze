name: Bug report
description: Report a reproducible problem with Blaze.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please remove cookies, tokens, private URLs, usernames, and other personal data before posting."
  - type: input
    id: version
    attributes:
      label: Blaze version
      placeholder: "CLI: output of --version; APK: version shown in About Blaze"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Windows 11 x64 / macOS Apple Silicon / Linux x64 / Android 14 ARM64"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Windows installer ZIP
        - macOS installer ZIP
        - Linux installer ZIP
        - Android / Termux installer ZIP
        - Android APK preview
        - Python source
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, terminal dashboard actions, or Android app taps you used.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, terminal size, or whether the problem occurs with --no-tui.
