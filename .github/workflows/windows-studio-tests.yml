name: Windows Studio source checks
on:
  pull_request:
    paths: ['music_studio/**', 'tests/Blaze-Desktop*', 'tests/Blaze-Mac-Design-UI-Tests.cjs', 'tests/Blaze-Mac-Stems-UI-Tests.cjs', 'tests/Blaze-Mac-Studio-UI-Tests.cjs', 'tests/Blaze-*Rhythm*-Tests.cjs', 'tests/Blaze-*Flow*-Tests.cjs', 'tests/Blaze-Timeline-Cells-Tests.cjs', 'tests/Blaze-Meter-Tests.py', 'tests/Blaze-Sequence-Tests.py', 'tests/Blaze-Chord-Evidence-Tests.py', 'tools/build_*models.py', 'tools/build_lv_frontend.py', 'tools/build_windows_studio.py', '.github/workflows/windows-studio-tests.yml']
  push:
    branches: [main]
    paths: ['music_studio/**', 'tests/Blaze-Desktop*', 'tests/Blaze-Mac-Design-UI-Tests.cjs', 'tests/Blaze-Mac-Stems-UI-Tests.cjs', 'tests/Blaze-Mac-Studio-UI-Tests.cjs', '.github/workflows/windows-studio-tests.yml']
permissions:
  contents: read
jobs:
  music-studio:
    name: Music Studio timing and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: node --version
      - run: python -m pip install numpy==1.26.4 onnxruntime==1.20.1 rich==14.2.0 yt-dlp==2026.8.19 ruff==0.14.0
      - run: |
          python -m ruff check --select F,E9 music_studio tools/build_structured_models.py tools/build_lv_frontend.py tools/build_rhythm_model.py tools/build_windows_studio.py
          python tests/Blaze-Meter-Tests.py
          python tests/Blaze-Chord-Evidence-Tests.py
          python tests/Blaze-Sequence-Tests.py
          python tests/Blaze-Uncertainty-Tests.py
          python tests/Blaze-Desktop-Discovery-Tests.py
          node tests/Blaze-Automatic-Rhythm-Tests.cjs
          node tests/Blaze-Live-Flow-Tests.cjs
          node tests/Blaze-Timeline-Cells-Tests.cjs
      - name: Install browser and local media test dependencies
        run: |
          # Keep Ubuntu package signature verification, using the official
          # archive instead of the Azure mirror that timed out during downloads.
          sudo python3 - <<'PYMIRROR'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != original:
                      path.write_text(updated)
          PYMIRROR
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          npm install --prefix "$RUNNER_TEMP/blaze-browser" --no-package-lock --no-save playwright@1.56.1
          "$RUNNER_TEMP/blaze-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify desktop discovery and existing media workflows
        env:
          BLAZE_TEST_PYTHON: python
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/blaze-browser/node_modules/playwright
          BLAZE_UI_SCREENSHOTS: ${{ runner.temp }}/blaze-desktop-screenshots
        run: |
          node tests/Blaze-Desktop-UI-Tests.cjs
          node tests/Blaze-Desktop-Discovery-UI-Tests.cjs
          node tests/Blaze-Mac-Design-UI-Tests.cjs
          node tests/Blaze-Mac-Stems-UI-Tests.cjs
          node tests/Blaze-Mac-Studio-UI-Tests.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Desktop-workflow-browser-checks
          path: ${{ runner.temp }}/blaze-desktop-screenshots/
