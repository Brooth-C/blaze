name: Android native tools
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager 'ndk;28.2.13676358'
      - uses: actions/cache@v6.1.0
        with:
          path: build/android-native-${{ matrix.abi }}/package/jniLibs/
          key: blaze-native-${{ matrix.abi }}-${{ hashFiles('android/native/build.sh') }}
      - name: Build verified native programs
        run: bash android/native/build.sh '${{ matrix.abi }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Blaze-Native-${{ matrix.abi }}
          path: build/android-native-${{ matrix.abi }}/package/
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.abi == 'arm64-v8a'
        with:
          name: Blaze-Native-Sources
          path: build/android-native-arm64-v8a/Blaze-Android-Native-Sources.tar.gz
