name: Export checked Mac archive for operator signing
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed main Mac workflow run
        required: true
        type: string
      source_sha:
        description: Exact tested main commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the source and export byte-identical archive chunks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          repo=os.environ['GH_REPO'];run=os.environ['SOURCE_RUN'];sha=os.environ['SOURCE_SHA']
          assert repo=='Brooth-C/blaze' and run.isdigit() and re.fullmatch('[a-f0-9]{40}',sha)
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          source=api('actions/runs/'+run)
          assert source['head_branch']=='main' and source['head_sha']==sha and source['event']=='push'
          assert source['status']=='completed' and source['conclusion']=='success'
          assert api('actions/workflows/'+str(source['workflow_id']))['path']=='.github/workflows/macos-app.yml'
          required=['Mac updater ABI / macOS 26','Mac DSP reference parity / macOS 26','Mac YouTube search / macOS 26','Native piano conversion / original checkpoint parity','Mac app / arm64','Mac native glass / macOS 26']
          jobs={j['name']:j['conclusion'] for j in api('actions/runs/'+run+'/jobs?per_page=100')['jobs']}
          assert all(jobs.get(name)=='success' for name in required),jobs
          subprocess.run(['gh','run','download',run,'--repo',repo,'--name','Blaze-Mac-arm64','--dir','input'],check=True)
          archive=Path('input/Blaze-Mac-arm64.zip');out=Path('export');out.mkdir()
          total=hashlib.sha256();parts=[];count=0;size=0
          with archive.open('rb') as incoming:
              while True:
                  first=incoming.read(8*1024**2)
                  if not first:break
                  assert count<4,'Archive exceeds this export workflow capacity'
                  name=f'part-{count:02d}';part_hash=hashlib.sha256();part_size=0
                  with (out/name).open('wb') as target:
                      block=first
                      while block:
                          target.write(block);total.update(block);part_hash.update(block)
                          size+=len(block);part_size+=len(block)
                          if part_size==384*1024**2:break
                          block=incoming.read(min(8*1024**2,384*1024**2-part_size))
                  parts.append({'name':name,'bytes':part_size,'sha256':part_hash.hexdigest()});count+=1
          manifest={'source_run_id':int(run),'source_sha':sha,'bytes':size,'sha256':total.hexdigest(),'parts':parts}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Blaze-operator-part-00
          compression-level: 0
          path: |
            export/part-00
            export/manifest.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Blaze-operator-part-01
          compression-level: 0
          path: export/part-01
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Blaze-operator-part-02
          compression-level: 0
          path: export/part-02
      - uses: actions/upload-artifact@v7.0.2
        if: hashFiles('export/part-03') != ''
        with:
          name: Blaze-operator-part-03
          compression-level: 0
          path: export/part-03
  stage-signed-0198:
    name: Stage verified 0.19.8 files on the existing release draft
    if: github.repository == 'Brooth-C/blaze' && github.ref == 'refs/heads/codex/stage-signed-macos-0198' && inputs.source_run_id == '44738372624' && inputs.source_sha == 'd0134508371e0957ad09d47325e75e1e9c15881d'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Brooth-C/blaze
      SOURCE_SHA: d0134508371e0957ad09d47325e75e1e9c15881d
    steps:
      - name: Verify the main build, its native checks, and the existing draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/branches/main" | jq -e '.commit.sha == env.SOURCE_SHA'
          gh api "repos/$GH_REPO/actions/runs/44738372624" | jq -e '.head_sha == env.SOURCE_SHA and .head_branch == "main" and .event == "push" and .status == "completed" and .path == ".github/workflows/macos-app.yml"'
          gh api "repos/$GH_REPO/actions/runs/44738372624/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json
          required = {"Mac updater ABI / macOS 26", "Mac DSP reference parity / macOS 26", "Mac YouTube search / macOS 26", "Native piano conversion / original checkpoint parity", "Mac app / arm64", "Mac native glass / macOS 26"}
          passed = {job["name"] for job in json.load(open("jobs.json"))["jobs"] if job["conclusion"] == "success"}
          assert required <= passed, required - passed
          PY
          gh api "repos/$GH_REPO/releases/456671565" | jq -e '.tag_name == "macos-v0.19.8" and .target_commitish == env.SOURCE_SHA and .draft and (.prerelease | not)'
      - name: Upload the two signed-release files without replacing existing assets
        shell: bash
        run: |
          set -euo pipefail
          gh run download 44738372624 --repo "$GH_REPO" --name Blaze-Mac-arm64 --dir .
          echo '' | base64 --decode > mac-appcast.xml
          cat > SHA256SUMS <<'SUMS'
          ad4c597e6bc179be4ce6d4be369d10ccf3214be00519255b6cad8c95ffa13386  Blaze-Mac-arm64.zip
          c5fece029bbf901b9a1903d9daec97e952b161c3ba2ad2d01e137705a2a155ae  mac-appcast.xml
          SUMS
          sha256sum --check SHA256SUMS
          for asset in Blaze-Mac-arm64.zip mac-appcast.xml; do
            digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            size="$(stat -c %s "$asset")"
            gh api "repos/$GH_REPO/releases/456671565" > release.json
            jq -e '.draft and .target_commitish == env.SOURCE_SHA and .tag_name == "macos-v0.19.8"' release.json
            if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' release.json > /dev/null; then
              gh release upload macos-v0.19.8 "$asset" --repo "$GH_REPO"
            fi
            gh api "repos/$GH_REPO/releases/456671565" | jq -e --arg asset "$asset" --arg digest "$digest" --argjson bytes "$size" 'any(.assets[]; .name == $asset and .digest == $digest and .size == $bytes and .state == "uploaded")'
          done
