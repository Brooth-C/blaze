name: Quality checks and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blaze-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-tests:
    name: Source / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install yt-dlp rich mutagen imageio-ffmpeg ruff
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Lint, compile and verify packages
        run: |
          python -m ruff check --select F,E9 blaze.py build.py package_installers.py Blaze-*-Tests.py
          python -m compileall -q blaze.py build.py package_installers.py Blaze-*-Tests.py
          bash -n macos-installer/Install-Blaze.command
          python package_installers.py --check
      - name: Regression and real local-media tests
        run: |
          python Blaze-Regression-Tests.py
          python Blaze-Reliability-Tests.py
          python Blaze-Integration-Tests.py
  installer-tests:
    name: Installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install the ZIP, launch, test upgrade and downloads
        run: python Blaze-Installer-Tests.py
  publish:
    name: Publish verified installers
    needs: [source-tests, installer-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create release for a new version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import re,pathlib; print(re.search(r"^VERSION = \"([^\"]+)\"", pathlib.Path("blaze.py").read_text(), re.M).group(1))')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version already published; checks completed without replacing assets."
            exit 0
          fi
          python package_installers.py --check
          sha256sum downloads/Blaze-Windows-Installer.zip downloads/Blaze-Mac-Installer.zip | sed 's@downloads/@@' > SHA256SUMS.txt
          gh release create "v$VERSION" downloads/Blaze-Windows-Installer.zip downloads/Blaze-Mac-Installer.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "Blaze v$VERSION" --notes-file RELEASE-NOTES.md --latest
