name: Blaze macOS app
on:
  pull_request:
    paths: ['music_studio/**', 'tests/media/**', 'tools/*macos*', 'tools/macos_decoder/**', 'tools/roformer/**', 'tools/instruments/**', 'tools/benchmark_macos_stems.py', 'tests/Blaze-Mac-*-Tests.py', 'tests/Blaze-Mac-Glass-Native.py', 'tests/Blaze-Mac-Search-Live.py', '.github/workflows/macos-app.yml']
  push:
    branches: [main]
    paths: ['music_studio/**', 'tests/media/**', 'tools/*macos*', 'tools/macos_decoder/**', 'tools/roformer/**', 'tools/instruments/**', 'tools/benchmark_macos_stems.py', 'tests/Blaze-Mac-*-Tests.py', 'tests/Blaze-Mac-Glass-Native.py', 'tests/Blaze-Mac-Search-Live.py', '.github/workflows/macos-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blaze-mac-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-piano-model:
    name: Native piano conversion / original checkpoint parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install pinned build-only conversion dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 einops==0.8.2 rotary-embedding-torch==0.8.9 beartype==0.18.5 PyYAML==6.0.2 librosa==0.11.0 scipy==1.14.1 numba==0.61.2 scikit-learn==1.5.2
      - uses: actions/cache@v6.1.0
        with:
          path: build/native-piano-source/mega53.ckpt
          key: blaze-native-piano-source-c62820893bbf86d4
      - name: Fetch the pinned original architecture and checkpoint
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ZFTurbo/Music-Source-Separation-Training.git build/msst
          git -C build/msst checkout 6fdad13686bb7e84d029ec66f9dbe76e65c93ebf
          if [ ! -f build/native-piano-source/mega53.ckpt ]; then
            python tools/instruments/fetch_checkpoint.py build/native-piano-source/mega53.ckpt
          fi
      - name: Export and validate the original complex piano head
        run: |
          python tools/instruments/export_piano.py --msst build/msst --checkpoint build/native-piano-source/mega53.ckpt --output build/native-piano
          python tools/instruments/verify_piano.py --assets build/native-piano
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Blaze-Native-Piano-fp32
          path: |
            build/native-piano/head-piano.onnx
            build/native-piano/models.json
            build/native-piano/export.json
            build/native-piano/validation.json
  search:
    name: Mac YouTube search / macOS 26
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install the pinned discovery engine
        run: python -m pip install yt-dlp==2026.10.26 yt-dlp-ejs==0.8.0
      - name: Verify real YouTube video and song search
        run: python tests/Blaze-Mac-Search-Live.py --output build/search/live.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Blaze-Mac-live-search
          path: build/search/
  glass:
    name: Mac native glass / macOS 26
    needs: app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install pinned native bridge
        run: python -m pip install pyobjc-core==12.2.2 pyobjc-framework-Cocoa==12.2.2 pyobjc-framework-WebKit==12.2.2 numpy==1.26.4 onnxruntime==1.31.0 rich==14.2.0 Pillow==11.3.0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Blaze-Mac-arm64
          path: build/mac26-artifact
      - name: Prepare the actual packaged app on macOS 26
        run: |
          ditto -x -k build/mac26-artifact/Blaze-Mac-arm64.zip build/mac26-app
          mkdir -p build/glass
          otool -l build/mac26-app/Blaze.app/Contents/MacOS/Blaze > build/glass/packaged-sdk-linkage.txt
      - name: Verify live search through the packaged downloader
        run: python tests/Blaze-Mac-Search-Live.py --tools build/mac26-app/Blaze.app/Contents/Resources/bin --output build/glass/live-search.json
      - name: Exercise the actual packaged app on macOS 26
        run: python tests/Blaze-Mac-Package-Tests.py --app build/mac26-app/Blaze.app --work build/glass/packaged --arch arm64
      - name: Exercise real glass and navigation in light and dark appearances
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess increaseContrast -bool false
          python tests/Blaze-Mac-Glass-Native.py --appearance light --expect-standard-material --output build/glass/light
          python tests/Blaze-Mac-Glass-Native.py --appearance dark --expect-standard-material --output build/glass/dark
      - name: Exercise system accessibility material adaptation
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool true
          defaults write com.apple.universalaccess increaseContrast -bool true
          python tests/Blaze-Mac-Glass-Native.py --appearance light --expect-reduced-transparency --expect-increased-contrast --output build/glass/accessibility
      - name: Restore runner accessibility preferences
        if: always()
        run: |
          defaults delete com.apple.universalaccess reduceTransparency || true
          defaults delete com.apple.universalaccess increaseContrast || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Blaze-Mac-native-glass-checks
          path: build/glass/
  app:
    name: Mac app / ${{ matrix.arch }}
    needs: [search, native-piano-model]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install pinned desktop dependencies
        run: python -m pip install numpy==1.26.4 onnxruntime==1.31.0 pywebview==6.1 pyobjc-core==12.2.2 pyobjc-framework-Cocoa==12.2.2 pyobjc-framework-WebKit==12.2.2 pyinstaller==6.16.0 Pillow==11.3.0 rich==14.2.0 ruff==0.14.0 yt-dlp==2026.10.26 yt-dlp-ejs==0.8.0
      - name: Source and platform checks
        run: |
          python -m ruff check --select F,E9 music_studio tools/build_macos_studio.py tools/build_macos_downloader.py tools/stage_macos_studio.py tools/macos_decoder/*.py tests/Blaze-Mac-*-Tests.py
          python tests/Blaze-Mac-Runtime-Tests.py
          python tests/Blaze-Mac-Presentation-Tests.py
          python tests/Blaze-Mac-Chrome-Tests.py
          python tests/Blaze-Mac-Waveform-Tests.py
          python tests/Blaze-Mac-Stem-Tests.py
          python tests/Blaze-Mac-Stem-Jobs-Tests.py
          python tests/Blaze-Mac-Stem-Runtime-Tests.py
          python tests/Blaze-Mac-Native-Piano-Tests.py
          python tests/Blaze-Mac-Piano-Tests.py
          python tests/Blaze-Mac-Roformer-Tests.py
          python tests/Blaze-Mac-Instruments-Tests.py
          python tests/Blaze-Meter-Tests.py
          python tests/Blaze-Chord-Evidence-Tests.py
          python tests/Blaze-Sequence-Tests.py
          node tests/Blaze-Live-Flow-Tests.cjs
          node tests/Blaze-Timeline-Cells-Tests.cjs
      - uses: actions/cache/restore@v6.1.0
        id: tools-cache
        with:
          path: build/mac-assets
          key: blaze-mac-tools-minimal-${{ matrix.arch }}-73bfa1bc-node2220-ytdlp20261026-notices2
      - uses: actions/cache@v6.1.0
        with:
          path: build/mac-assets/stem-models
          key: blaze-mac-stems-native-piano-v1-full-fp32
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Blaze-Native-Piano-fp32
          path: build/mac-assets/stem-models/native-piano
      - name: Stage pinned model and downloader assets
        run: python tools/stage_macos_studio.py --work build/mac-assets --arch ${{ matrix.arch }}
      - uses: actions/cache/restore@v6.1.0
        id: decoder-cache
        with:
          path: |
            tools/macos_decoder/downloads
            tools/macos_decoder/output
          key: blaze-mac-lgpl-${{ matrix.arch }}-${{ hashFiles('tools/macos_decoder/*.py', 'tools/macos_decoder/*.sh', 'tools/macos_decoder/*.json') }}
      - name: Build verified LGPL media tools
        run: |
          if [ ! -f tools/macos_decoder/output/decoder-manifest.json ]; then
            python tools/macos_decoder/fetch_sources.py
            bash tools/macos_decoder/build.sh
            python tools/macos_decoder/package_sources.py
          fi
      - uses: actions/cache/save@v6.1.0
        if: steps.decoder-cache.outputs.cache-hit != 'true'
        with:
          path: |
            tools/macos_decoder/downloads
            tools/macos_decoder/output
          key: ${{ steps.decoder-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6.1.0
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: build/mac-assets
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Verify real bundled stem inference with the packaged decoder
        env:
          BLAZE_STEM_MODEL_DIR: music_studio/stem_models
        run: |
          export PATH="$PWD/tools/macos_decoder/output/bin:$PATH"
          python tests/Blaze-Mac-Stem-Tests.py
          python tests/Blaze-Mac-Piano-Tests.py
          BLAZE_REAL_ROFORMER=1 python tests/Blaze-Mac-Roformer-Tests.py
          BLAZE_REAL_INSTRUMENTS=1 python tests/Blaze-Mac-Instruments-Tests.py
          BLAZE_REAL_NATIVE_PIANO=1 python tests/Blaze-Mac-Native-Piano-Tests.py
      - name: Build minimal separate downloader
        run: python tools/build_macos_downloader.py --arch ${{ matrix.arch }} --output build/mac-assets/bin --work build/mac-downloader --notices build/mac-assets/notices
      - name: Build Blaze.app
        run: |
          python tools/build_macos_studio.py --arch ${{ matrix.arch }} --version 0.17.0 \
            --ffmpeg tools/macos_decoder/output/bin/ffmpeg --ffprobe tools/macos_decoder/output/bin/ffprobe \
            --decoder-materials tools/macos_decoder/output --ytdlp build/mac-assets/bin/yt-dlp \
            --node build/mac-assets/bin/node --external-notices build/mac-assets/notices --python-license build/mac-assets/notices/Python-LICENSE.txt --python-license-version 3.12.10 --output dist --work build/mac-bundle
      - name: Verify the native app and rendered Cocoa interface
        run: python tests/Blaze-Mac-Package-Tests.py --app dist/Blaze.app --work build/mac-tests --arch ${{ matrix.arch }}
      - name: Record native interface proof
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('build/mac-tests/native-ui.png')
          if p.is_file(): print('BLAZE_MAC_UI:' + base64.b64encode(p.read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Blaze-Mac-${{ matrix.arch }}
          path: dist/Blaze-Mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Blaze-Mac-checks-${{ matrix.arch }}
          path: |
            build/mac-tests/*.json
            build/mac-tests/*.png
            build/mac-tests/ui-smoke-data/desktop.log
            tools/macos_decoder/logs/
  publish:
    name: Publish tested Mac app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [app, glass]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Blaze-Mac-*
          merge-multiple: true
          path: artifacts
      - name: Publish immutable Apple Silicon Mac build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          tag = 'macos-v0.17.0'
          files = [Path('artifacts/Blaze-Mac-arm64.zip')]
          digests = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          probe = subprocess.run(['gh','api','repos/' + os.environ['GH_REPO'] + '/releases/tags/' + tag], capture_output=True, text=True)
          if probe.returncode == 0:
              existing = json.loads(probe.stdout)
              assert existing['target_commitish'] == '${{ github.sha }}', 'Existing release targets another source'
              assert not existing['draft'] and not existing['prerelease'], 'Existing release is not a finished normal release'
              assets = {a['name']: a for a in existing['assets']}
              for p in files:
                  assert assets[p.name]['size'] == p.stat().st_size
                  assert assets[p.name].get('digest') == 'sha256:' + digests[p.name], 'Existing release is immutable'
              subprocess.run(['gh','release','edit',tag,'--latest'],check=True)
              print('Existing Mac release verified; no assets replaced.')
          elif 'HTTP 404' in probe.stderr:
              notes = Path('docs/RELEASE-0.17.0.md').read_text(encoding='utf-8')
              notes += '\n\n## macOS installation\n\nThis build supports **Apple Silicon (M1 and newer)** only. Extract the ZIP and move Blaze.app to Applications. No separate Python or model installation is needed. This build is ad-hoc signed and not Apple-notarized; macOS may require Privacy & Security → Open Anyway. Packaged smoke tests cover Apple Silicon on macOS 26 only. Intel development ended with the 0.9.0 release; its existing download remains available. Matching LGPL decoder sources, licenses, model notices and rebuild scripts are included.\n\n'
              notes += '\n'.join(f'{p.name}: {p.stat().st_size} bytes; SHA256 `{digests[p.name]}`' for p in files)
              Path('notes.md').write_text(notes)
              subprocess.run(['gh','release','create',tag,*map(str,files),'--target','${{ github.sha }}','--title','Blaze for macOS','--notes-file','notes.md','--latest=true'],check=True)
          else:
              raise RuntimeError('Cannot verify the Mac release state: ' + probe.stderr.strip())
          latest = json.loads(subprocess.run(['gh','api','repos/' + os.environ['GH_REPO'] + '/releases/latest'],capture_output=True,text=True,check=True).stdout)
          assert latest['tag_name'] == tag and not latest['draft'] and not latest['prerelease'], 'Mac release is not Latest stable'
          assert latest['target_commitish'] == '${{ github.sha }}', 'Latest release targets another source'
          PY
