name: Android offline Studio validation
on:
  pull_request:
    paths: ['android/**', 'music_studio/lv_frontend.py', 'music_studio/structured.py', 'tests/Blaze-Android*-Tests.py', 'tests/Blaze-Mobile*-Tests.py', 'tests/java/**', 'tools/stage_android_studio.py', 'tools/sync_android_harmony.py', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android/**', 'music_studio/lv_frontend.py', 'music_studio/structured.py', 'tests/Blaze-Android*-Tests.py', 'tests/Blaze-Mobile*-Tests.py', 'tests/java/**', 'tools/stage_android_studio.py', 'tools/sync_android_harmony.py', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blaze-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/cache@v6.1.0
        with:
          path: build/android-released-assets
          key: blaze-android-assets-native-d7dbd408-models-73bfa1bc
      - name: Stage verified existing native and pretrained model releases
        run: |
          python tools/stage_android_studio.py --work build/android-released-assets
          python tools/sync_android_harmony.py
      - name: Engine and backend checks
        run: |
          python -m pip install numpy==1.26.4 onnxruntime==1.20.1 yt-dlp==2026.8.19 cryptography imageio-ffmpeg ruff==0.14.0
          python tests/Blaze-Mobile-Tests.py
          python tests/Blaze-Mobile-Integration-Tests.py
          python tests/Blaze-Mobile-Chord-Tests.py
          python tests/Blaze-Android-Harmony-Tests.py
          python tests/Blaze-Android-Rhythm-Frontend-Tests.py
          python -m ruff check --select F,E9 android/app/src/main/python/ tests/Blaze-Android*-Tests.py tools/stage_android_studio.py tools/sync_android_harmony.py
          mkdir -p build/chord-tests
          javac -d build/chord-tests android/app/src/main/java/com/brooth/blaze/{ChordEngine,StudioChord,StudioTimeline,StudioSignal,StudioMeter}.java tests/java/com/brooth/blaze/StudioTimelineTest.java tests/java/com/brooth/blaze/StudioMeterTest.java tests/java/com/brooth/blaze/StudioChordVoicingTest.java
          java -cp build/chord-tests com.brooth.blaze.StudioTimelineTest
          java -cp build/chord-tests com.brooth.blaze.StudioMeterTest
          java -cp build/chord-tests com.brooth.blaze.StudioChordVoicingTest
      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-instrumentation-bundle
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: Android-build-diagnostics
          path: android/app/build/reports/
  emulator:
    name: Android tests / API ${{ matrix.api }}
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Android-instrumentation-bundle
          path: apk-tests
      - name: Enable emulator acceleration
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install apk-tests/debug/app-debug.apk
            adb install apk-tests/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.brooth.blaze.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.log
            adb logcat -d > android-logcat.txt
            mkdir -p screenshots
            for name in Blaze-Android-Home Blaze-Android-Studio-Portrait Blaze-Android-Studio-Large-Text Blaze-Android-Studio-Landscape Blaze-Android-Studio-Options; do adb exec-out run-as com.brooth.blaze cat "files/$name.png" > "screenshots/$name.png"; done
            grep -Eq '^OK \([0-9]+ tests?\)' instrumentation.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Android-emulator-${{ matrix.api }}
          path: |
            instrumentation.log
            screenshots/
            android-logcat.txt
  publish:
    name: Publish Android preview
    needs: [apk, emulator]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Android-instrumentation-bundle
          path: apk-tests
      - name: Publish one immutable APK after both phone suites pass
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then exit 0; fi
          VERSION=$(python -c 'import re,pathlib; print(re.search(r"versionName\s+[^0-9]([0-9][A-Za-z0-9.+-]*)", pathlib.Path("android/app/build.gradle").read_text()).group(1))')
          TAG="android-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Existing signed APK is preserved."; exit 0; fi
          cp apk-tests/debug/app-debug.apk Blaze-Android-Preview.apk
          cp docs/ANDROID-RELEASE-NOTES.md RELEASE.txt
          printf '\nAPK SHA256: `%s`\n' "$(sha256sum Blaze-Android-Preview.apk | cut -d ' ' -f 1)" >> RELEASE.txt
          gh release create "$TAG" Blaze-Android-Preview.apk --target "$GITHUB_SHA" --title "Blaze Android $VERSION" --notes-file RELEASE.txt --prerelease --latest=false
