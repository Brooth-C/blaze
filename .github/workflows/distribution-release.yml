name: Publish verified distribution
on:
  push:
    branches: [main]
    paths: ['tools/release_catalog.json', 'tools/promote_distribution.py', 'tests/Blaze-Distribution-Tests.py', '.github/workflows/distribution-release.yml']
  pull_request:
    paths: ['tools/release_catalog.json', 'tools/promote_distribution.py', 'tests/Blaze-Distribution-Tests.py', '.github/workflows/distribution-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blaze-distribution-promotion
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install ruff==0.14.0
          python -m ruff check --select F,E9 tools/promote_distribution.py tests/Blaze-Distribution-Tests.py
          python tests/Blaze-Distribution-Tests.py
          python tests/Blaze-Release-Tests.py
          python tests/Blaze-Promotion-Tests.py
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Verify native proof and publish pinned original binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/promote_distribution.py
